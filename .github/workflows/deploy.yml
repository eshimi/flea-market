name: 毎日の更新（Cloudflare Workers へデプロイ）

# 毎朝 5:17（日本時間）＝ 20:17 UTC と、手動実行で動く。
# 公式ページの確認（scripts/check-sources.mjs）→ 確認結果を data/ に保存してコミット → ページ生成 → デプロイ。
# ページは日付で中身が変わる（「今週末」・過ぎた開催の除外）ので、データに変更がなくても、毎日デプロイする。
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN（Workers の編集権限）, CLOUDFLARE_ACCOUNT_ID。未設定ならデプロイを飛ばす。
# Variables: SITE_URL（本番の URL）、CONTACT_EMAIL（掲載の修正・削除の依頼を受けるメールアドレス）。どちらかが未設定の間は、検索に載せない（noindex）
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: 'すべての情報源を確認する（7日ごとの間隔を無視）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PDF の読み取り用（poppler）
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: npm test
      - name: 公式ページの確認
        continue-on-error: true
        run: node scripts/check-sources.mjs ${{ inputs.all && '--all' || '' }}
      - name: 巡回するサイトの確認（変更があれば、確認待ちに入れる）
        continue-on-error: true
        run: node scripts/crawl-watch.mjs
      - name: ブログ記事の自動作成（今週末・来月のまとめ・新着の掲載）
        continue-on-error: true
        run: node scripts/generate-blog.mjs
      - name: 過去の開催の記録を追記
        continue-on-error: true
        run: node scripts/update-archive.mjs
      - name: ページ生成（データの検証・サイトマップを含む）
        run: npm run build
      - name: 確認結果をリポジトリに保存
        continue-on-error: true
        run: |
          files="data/series.json data/source-state.json data/sitemap-lastmod.json data/blog-auto data/crawl-state.json data/review-queue.json data/archive.json data/venues.json"
          if [ -z "$(git status --porcelain -- $files)" ]; then echo "変更はありません"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tar cf "$RUNNER_TEMP/save.tar" $files
          # 実行中にブランチが進んでいたら、最新の上に、確認結果だけを載せ直す（最大3回）
          for i in 1 2 3; do
            git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf "$RUNNER_TEMP/save.tar"
            # 実行中に人（や週2回の更新）が更新したファイルは、古い版で上書きしない（次回の実行でやり直す）
            for f in data/series.json data/review-queue.json data/venues.json; do
              if ! git diff --quiet "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" -- "$f"; then git checkout "origin/${GITHUB_REF_NAME}" -- "$f"; fi
            done
            git add -A $files
            git diff --cached --quiet && { echo "変更はありません"; exit 0; }
            git commit -q -m "公式ページの確認結果・サイトマップの更新日・自動のブログ記事を保存 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::確認結果を保存できませんでした"; exit 1
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare の Secrets が未設定のため、デプロイを飛ばしました"; exit 0
          fi
          # build.command（npm run build）は、デプロイの直前にもう一度走る（冪等）
          npx --yes wrangler@4 deploy
